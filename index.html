<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PR Youth — Penumuli Youth Team Expense Tracker</title>

    <!-- High-Speed Asset Preloading -->
    <link rel="preload" href="/Logo.png" as="image" type="image/png" />
    <link rel="preload" href="/Favicon.png" as="image" type="image/png" />

    <!-- Standard Browser Favicon -->
    <link rel="icon" type="image/png" href="/Favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/Favicon.png" />

    <!-- Apple iOS Mobile Home Screen App Icon -->
    <link rel="apple-touch-icon" href="/Favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/Favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Favicon.png" />
    <link rel="apple-touch-startup-image" href="/Favicon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PR Youth" />

    <!-- Android Chrome & PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f52ba" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
